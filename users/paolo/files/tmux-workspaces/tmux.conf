# ~/.config/tmux/tmux.conf
# Workspaces = one tmux session per project folder; tabs (windows) inside each
# for nvim / agents / shells; notifications that say which workspace + tab
# needs you. tmux 3.8 (workspace numbering and sorting use 3.8 formats).
#
# Two bars at the top:
#   workspaces   ▎1 api ▌2 web ▎3 infra       numbered in the order you opened them; the edge
#                                              is in the folder colour (~/dq orange, ~/pb purple, ~/ag cyan)
#   tabs         ▎1 nvim ▌2 claude ▎3 zsh     named after the program running in them
#   agent state on the edge and name: thick ▌ pink-red = waiting on you, green = done
#   (clears when you visit), light grey = working; thin ▎ = idle
#
#   Alt+1…9, Alt+0              tab 1…10 (C-b 1…9 and C-b 0 too)
#   Alt+Shift+1…9, Alt+Shift+0  workspace 1…10
#   C-b W         open a folder as a workspace, or switch to it (fzf picker)
#   C-b w         tree of workspaces > tabs with markers and live preview (C-b s: tabs collapsed)
#   Alt+a, C-b a  jump to the agent that has waited longest, in any workspace
#   C-b A         agent in a fresh git worktree (asks for a branch, and for a profile outside ~/dq and ~/ag)
#   C-b X         close this workspace (asks first; you land in another one)
#   click         a workspace or tab in the bars to switch to it
#   top right:    what timewarrior is tracking (as in the prompt), and "prefix" after C-b
#   tmux 3.8:     C-b Tab = fuzzy tab switcher, C-b S-Tab = fuzzy workspace switcher
#
# Alt needs the terminal to send Option as Alt (Alacritty: window.option_as_alt).
# Try it:  ~/.config/tmux/bin/tmux-agent demo   (fake agent in a background tab)
# Personal tweaks go in ~/.config/tmux/local.conf (sourced last, optional).
#
# Notifications: coloured edges and names in both bars, a message in the status line
# when an agent elsewhere changes state, and a desktop notification when no
# tmux client has focus. Claude Code uses Ctrl-B to background a command:
# inside tmux press C-b twice.

##### core ####################################################################
set -s  escape-time 10
set -g  focus-events on
set -g  history-limit 50000
set -g  mouse on
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  detach-on-destroy off        # closing a workspace drops you into another one
setw -g aggressive-resize on
set -g  set-titles on
set -g  set-titles-string '#{b:session_path}'   # project folder, so Mission Control labels windows by project
set -g  display-time 3000
set -g  status-interval 5
setw -g mode-keys vi
set -s  set-clipboard on

# from Claude Code's docs: Shift+Enter and notifications inside tmux
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g  allow-passthrough on

%if #{<:#{version},3.6}
set -as terminal-features ',xterm*:RGB,alacritty:RGB,foot:RGB,wezterm:RGB'
%endif

setw -g monitor-bell on
set -g  bell-action other
set -g  visual-bell off

##### agent markers ###########################################################
# @agent is set per pane by `tmux-agent state` (agent hooks). It is ignored once
# the pane is back at a shell prompt, so a crashed agent can't leave a stale dot.
set -g @agent-live '#{?#{m/r:^((ba|z|fi|da|k|tc)?sh|nu)$,#{pane_current_command}},,#{@agent}}'
# Same colours as the bars (pink-red, green, light grey); shown in the C-b w tree.
set -g @agent-icon '#{?#{==:#{E:@agent-live},waiting},#[fg=#f7768e]●,#{?#{==:#{E:@agent-live},done},#[fg=#9ece6a]✓,#{?#{==:#{E:@agent-live},working},#[fg=colour250]●,}}}'
set-hook -g pane-focus-in 'if -F "#{==:#{@agent},done}" "set -p -u @agent"'

##### bars ####################################################################
# Backgrounds get lighter towards the content, nested like browser tabs:
#   row 1, other workspaces      #0a0a0a  darkest
#   row 1, current workspace     #111111  } the same shade, so the current
#   row 2, other tabs            #111111  } workspace flows into its tabs
#   row 2, current tab           terminal (#181818), lifted and joined to the content
# Every workspace and tab starts with an edge that shows agent state: a thick ▌
# in pink-red (waiting) or green (done), with the name in the same colour, or
# in light grey (working); a thin ▎ when idle, in the folder colour for
# workspaces, dim grey for tabs, bright white for the current tab. A workspace shows the most
# urgent state among its tabs. Nothing changes width, so tabs never move.
# Explicit colours rather than the terminal's palette: Alacritty's green and
# yellow look too much like the orange folder colour.
set -g status 2
set -g status-position top
set -g status-style 'bg=#111111,fg=colour250'
# Workspace number: 1…9, then 0 for the 10th (like the digit keys), none after.
# #{S/i:} lists workspaces in the order they were opened, same as `tmux-agent ws`.
set -g @ws-num '#{?#{e|<:#{loop_index},9},#{e|+:#{loop_index},1} ,#{?#{==:#{loop_index},9},0 ,}}'
# Folder colour, only on a workspace's edge while no agent there is waiting,
# done or working: ~/dq orange, ~/pb purple, ~/ag cyan, dim grey elsewhere
# (red stays reserved for "waiting").
set -g @ws-colour '#{?#{m:#{HOME}/dq/*,#{session_path}/},#ff9e64,#{?#{m:#{HOME}/pb/*,#{session_path}/},#bb9af7,#{?#{m:#{HOME}/ag/*,#{session_path}/},#7dcfff,default}}}'
set -g @ws-edge-colour '#{?#{==:#{E:@ws-colour},default},colour240,#{E:@ws-colour}}'
# The most urgent waiting/done colour, or empty; working shows on the edge only.
set -g @ws-state '#{?#{m:*waiting*,#{W:#{P:#{E:@agent-live} }}},#f7768e,#{?#{m:*done*,#{W:#{P:#{E:@agent-live} }}},#9ece6a,}}'
set -g @tab-state '#{?#{m:*waiting*,#{P:#{E:@agent-live} }},#f7768e,#{?#{m:*done*,#{P:#{E:@agent-live} }},#9ece6a,}}'
set -g @ws-edge '#{?#{E:@ws-state},#[fg=#{E:@ws-state}]▌,#{?#{m:*working*,#{W:#{P:#{E:@agent-live} }}},#[fg=colour250]▌,#[fg=#{E:@ws-edge-colour}]▎}}'
set -g @tab-edge '#{?#{E:@tab-state},#[fg=#{E:@tab-state}]▌,#{?#{m:*working*,#{P:#{E:@agent-live} }},#[fg=colour250]▌,#[fg=colour240]▎}}'
# The current tab's edge takes its text colour: bright white unless an agent's
# state colours it.
set -g @tab-cur-edge '#{?#{E:@tab-state},#[fg=#{E:@tab-state}]▌,#{?#{m:*working*,#{P:#{E:@agent-live} }},#[fg=colour255]▌,#[fg=colour255]▎}}'
set -g @ws '#[range=session|#{session_id}]#{E:@ws-edge}#[fg=#{?#{E:@ws-state},#{E:@ws-state},colour248}]#{E:@ws-num}#{session_name} #[norange]'
set -g @ws-cur '#[range=session|#{session_id}]#[bg=#111111]#{E:@ws-edge}#[fg=#{?#{E:@ws-state},#{E:@ws-state},colour255}]#[bold]#{E:@ws-num}#{session_name}#[nobold] #[bg=#0a0a0a]#[norange]'
set -g status-format[0] '#[fill=#0a0a0a]#[bg=#0a0a0a]#[align=left]#{S/i:#{E:@ws},#{E:@ws-cur}}#[align=right]#{?client_prefix,#[bg=colour250]#[fg=#0a0a0a]#[bold] prefix #[nobold]#[bg=#0a0a0a] ,}#[fg=colour109]#(~/.config/tmux/bin/tmux-agent timew) '
# Tabs: the 10th shows as 0, like Alt+0. One space of padding on the right,
# like the workspaces.
set -g @tab '#[range=window|#{window_index}]#{E:@tab-edge}#[fg=#{?#{E:@tab-state},#{E:@tab-state},colour248}]#{?#{==:#{window_index},10},0,#I} #{=16:window_name}#{?window_zoomed_flag,+,} #[norange]'
set -g @tab-cur '#[range=window|#{window_index}]#[bg=terminal]#{E:@tab-cur-edge}#[fg=#{?#{E:@tab-state},#{E:@tab-state},colour255}]#[bold]#{?#{==:#{window_index},10},0,#I} #{=16:window_name}#{?window_zoomed_flag,+,}#[nobold] #[bg=#111111]#[norange]'
set -g status-format[1] '#[align=left]#{W:#{E:@tab},#{E:@tab-cur}}'
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},session}' 'switch-client -t =' 'select-window -t ='

##### tabs ####################################################################
bind c new-window -c '#{session_path}'   # new tab at the workspace root
# Alt+1…9 and Alt+0 = tab 1…10; C-b 0 = tab 10 too (tabs start at 1)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10
bind 0      select-window -t :=10

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

##### workspaces + agents #####################################################
# Alt+Shift+1…9 and Alt+Shift+0 = workspace 1…10. On the Italian - Pro layout
# Shift+digit types ! " £ $ % & / ( ) =, and with Option as Alt that's what
# tmux receives, so these bindings only fit that layout.
bind -n 'M-!' run-shell "~/.config/tmux/bin/tmux-agent ws 1 '#{client_name}'"
bind -n 'M-"' run-shell "~/.config/tmux/bin/tmux-agent ws 2 '#{client_name}'"
bind -n 'M-£' run-shell "~/.config/tmux/bin/tmux-agent ws 3 '#{client_name}'"
bind -n 'M-$' run-shell "~/.config/tmux/bin/tmux-agent ws 4 '#{client_name}'"
bind -n 'M-%' run-shell "~/.config/tmux/bin/tmux-agent ws 5 '#{client_name}'"
bind -n 'M-&' run-shell "~/.config/tmux/bin/tmux-agent ws 6 '#{client_name}'"
bind -n 'M-/' run-shell "~/.config/tmux/bin/tmux-agent ws 7 '#{client_name}'"
bind -n 'M-(' run-shell "~/.config/tmux/bin/tmux-agent ws 8 '#{client_name}'"
bind -n 'M-)' run-shell "~/.config/tmux/bin/tmux-agent ws 9 '#{client_name}'"
bind -n 'M-=' run-shell "~/.config/tmux/bin/tmux-agent ws 10 '#{client_name}'"

bind W display-popup -E -w 70% -h 60% -T ' open workspace ' '~/.config/tmux/bin/tmux-agent open'
bind    a   run-shell "~/.config/tmux/bin/tmux-agent next '#{pane_id}' '#{client_name}'"
bind -n M-a run-shell "~/.config/tmux/bin/tmux-agent next '#{pane_id}' '#{client_name}'"
bind X confirm-before -p 'close workspace #S? (y/n)' kill-session
bind A display-popup -E -w 64 -h 8 -d '#{pane_current_path}' -T ' agent in a new worktree ' \
         '~/.config/tmux/bin/tmux-agent new'

# Trees: markers next to each item, and shortcut keys 1…9, 0, then M-a…M-z
# (tmux's own start at 0).
set -g @tree-fmt '#{?pane_format,#{E:@agent-icon}#[default] ,#{?window_format,#{P:#{E:@agent-icon}}#[default] ,#{W:#{P:#{E:@agent-icon}}}#[default] }}#{E:tree_mode_format}'
set -g @tree-keys '#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{==:#{line},9},0,#{?#{e|<:#{line},36},M-#{a:#{e|+:87,#{line}}},}}}'
bind w choose-tree -Zw -F '#{E:@tree-fmt}' -K '#{E:@tree-keys}'
bind s choose-tree -Zs -F '#{E:@tree-fmt}' -K '#{E:@tree-keys}'

# personal overrides (optional file)
source-file -q ~/.config/tmux/local.conf
